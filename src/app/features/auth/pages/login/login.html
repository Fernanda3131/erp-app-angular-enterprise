<div class="login-container">

  <div class="login-card">

    <h1>ERP</h1>

    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
        >

      </div>

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

  </div>

</div>
